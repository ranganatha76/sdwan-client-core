services:
  control-plane:
    build:
      context: .
      args:
        TARGET: .
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  policy-service:
    build:
      context: .
      args:
        TARGET: ./cmd/policy-service
    environment:
      POLICY_SERVICE_TOKEN: ${POLICY_SERVICE_TOKEN:?set POLICY_SERVICE_TOKEN in .env}
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  dataplane-agent:
    build:
      context: .
      args:
        TARGET: ./cmd/dataplane-agent
    environment:
      POLICY_SERVICE_URL: http://policy-service:8081
      POLICY_SERVICE_TOKEN: ${POLICY_SERVICE_TOKEN:?set POLICY_SERVICE_TOKEN in .env}
      DATAPLANE_MODE: observe
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      policy-service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped