services:
  control-plane:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./cmd/control-plane
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  ui-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./cmd/ui-service
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  policy-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./cmd/control-plane/policy-service
    environment:
      POLICY_SERVICE_TOKEN: ${POLICY_SERVICE_TOKEN:?set POLICY_SERVICE_TOKEN in .env}
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  dataplane-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./cmd/data-plane/agent
    environment:
      POLICY_SERVICE_URL: http://policy-service:8081
      POLICY_SERVICE_TOKEN: ${POLICY_SERVICE_TOKEN:?set POLICY_SERVICE_TOKEN in .env}
      DATAPLANE_MODE: observe
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      policy-service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  timeseries-db:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: pulseroute
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_TOKEN:?set INFLUXDB_ADMIN_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_ORG: pulseroute
      DOCKER_INFLUXDB_INIT_BUCKET: performance
      DOCKER_INFLUXDB_INIT_RETENTION: 168h
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?set INFLUXDB_ADMIN_TOKEN in .env}
    volumes:
      - influx-data:/var/lib/influxdb2
    expose:
      - "8086"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  metrics-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./cmd/observability/metrics-server
    environment:
      INFLUX_URL: http://timeseries-db:8086
      INFLUX_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?set INFLUXDB_ADMIN_TOKEN in .env}
      INFLUX_ORG: pulseroute
      INFLUX_BUCKET: performance
    depends_on:
      timeseries-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_SECURITY_ADMIN_USER: pulseroute-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?set INFLUXDB_ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      timeseries-db:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  influx-data:
  grafana-data: