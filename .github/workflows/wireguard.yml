name: WireGuard provisioning proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests and static checks
        run: |
          go test -race ./...
          go vet ./...
      - name: Install test networking utilities
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y wireguard-tools iproute2 iputils-ping
      - name: Verify real Linux WireGuard traffic
        run: |
          CGO_ENABLED=0 go build -o /tmp/wireguard-provision ./cmd/wireguard-provision
          sudo -n install -m 0755 /tmp/wireguard-provision /usr/local/bin/wireguard-provision
          sudo -n bash deploy/wireguard/integration.sh